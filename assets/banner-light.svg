<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Quantium Crew, S.A. — Software a la medida desde Panama">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBFCFA"/>
      <stop offset="55%" stop-color="#F2F6F3"/>
      <stop offset="100%" stop-color="#E7F2EC"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00B888"/>
      <stop offset="50%" stop-color="#009E77"/>
      <stop offset="100%" stop-color="#046A57"/>
    </linearGradient>
    <linearGradient id="ember" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F59A24"/>
      <stop offset="100%" stop-color="#E4682A"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0A1418"/>
      <stop offset="70%" stop-color="#11282A"/>
      <stop offset="100%" stop-color="#0C5E4E"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#009E77" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#00B888" stop-opacity="0.5"/>
      <stop offset="80%" stop-color="#E4682A" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#E4682A" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00B888" stop-opacity="0.20"/>
      <stop offset="60%" stop-color="#00B888" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#00B888" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.4" fill="#0E7C66" fill-opacity="0.14"/>
    </pattern>
    <pattern id="mesh" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0 H0 V80" fill="none" stroke="#0E7C66" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#mesh)"/>
  <rect width="1280" height="320" fill="url(#dots)"/>
  <ellipse cx="1058" cy="160" rx="330" ry="250" fill="url(#glow)"/>

  <g stroke="#0E7C66" stroke-opacity="0.12" stroke-width="1.5">
    <path d="M-40 320 L300 -20"/>
    <path d="M20 320 L360 -20"/>
    <path d="M1180 320 L1340 140"/>
  </g>

  <g transform="translate(86,96)">
    <circle cx="64" cy="64" r="60" fill="#FFFFFF" stroke="#CBE3DA" stroke-width="1.5"/>
    <ellipse cx="64" cy="64" rx="58" ry="23" fill="none" stroke="url(#accent)" stroke-opacity="0.45" stroke-width="2.5" transform="rotate(-32 64 64)"/>
    <circle cx="64" cy="64" r="40" fill="none" stroke="url(#accent)" stroke-width="12" stroke-linecap="butt"/>
    <path d="M83 83 L113 113" stroke="url(#ember)" stroke-width="12" stroke-linecap="round"/>
    <circle cx="13" cy="38" r="4" fill="#00B888"/>
    <circle cx="118" cy="82" r="3" fill="#E4682A"/>
  </g>

  <g font-family="'Helvetica Neue',Helvetica,Arial,sans-serif">
    <text x="258" y="142" fill="url(#word)" font-size="50" font-weight="700" letter-spacing="7">QUANTIUM CREW</text>
    <text x="262" y="182" fill="#3D5A53" font-size="19" font-weight="500" letter-spacing="1.2">Software a la medida desde Panama — web, Apple nativo, dashboards y automatizacion.</text>

    <rect x="262" y="206" width="220" height="2" fill="url(#rule)"/>

    <g font-size="13" font-weight="600" letter-spacing="3.4" fill="#0C7A62">
      <text x="262" y="246">SOCIEDAD ANONIMA · CIUDAD DE PANAMA</text>
      <text x="262" y="272" fill="#5A756E" letter-spacing="3.4">REACT · TYPESCRIPT · SWIFT · NODE · PYTHON · DOCKER</text>
    </g>
  </g>

  <g transform="translate(1078,160)" fill="none" stroke-linecap="round">
    <circle r="112" stroke="#CADFD6" stroke-width="1.2"/>
    <circle r="82" stroke="#CADFD6" stroke-width="1.2"/>
    <circle r="52" stroke="#CADFD6" stroke-width="1.2"/>
    <path d="M0 -112 A112 112 0 0 1 97 -56" stroke="url(#accent)" stroke-width="5"/>
    <path d="M0 82 A82 82 0 0 1 -71 41" stroke="url(#accent)" stroke-width="4" stroke-opacity="0.75"/>
    <path d="M52 0 A52 52 0 0 1 26 45" stroke="url(#ember)" stroke-width="4"/>
    <circle cx="0" cy="-112" r="5.5" fill="#00B888" stroke="none"/>
    <circle cx="-71" cy="41" r="4.5" fill="#009E77" stroke="none"/>
    <circle cx="26" cy="45" r="4" fill="#E4682A" stroke="none"/>
    <circle r="9" fill="#00B888" stroke="none" fill-opacity="0.9"/>
    <circle r="18" stroke="#00B888" stroke-opacity="0.4" stroke-width="1.5"/>
  </g>

  <rect x="0" y="316" width="1280" height="4" fill="url(#rule)"/>
</svg>
