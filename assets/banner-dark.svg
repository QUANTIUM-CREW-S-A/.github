<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Quantium Crew, S.A. — Software a la medida desde Panama">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0E13"/>
      <stop offset="55%" stop-color="#0C1319"/>
      <stop offset="100%" stop-color="#101B1D"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6DF5C8"/>
      <stop offset="50%" stop-color="#11D29B"/>
      <stop offset="100%" stop-color="#0E9C7E"/>
    </linearGradient>
    <linearGradient id="ember" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFC861"/>
      <stop offset="100%" stop-color="#FF8A3D"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#E7F5F0"/>
      <stop offset="100%" stop-color="#9FE3CC"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00C08B" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#3BE8B0" stop-opacity="0.45"/>
      <stop offset="80%" stop-color="#FF8A3D" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FF8A3D" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00C08B" stop-opacity="0.30"/>
      <stop offset="60%" stop-color="#00C08B" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#00C08B" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.4" fill="#2BBF95" fill-opacity="0.16"/>
    </pattern>
    <pattern id="mesh" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0 H0 V80" fill="none" stroke="#3BE8B0" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#mesh)"/>
  <rect width="1280" height="320" fill="url(#dots)"/>
  <ellipse cx="1058" cy="160" rx="330" ry="250" fill="url(#glow)"/>

  <!-- diagonal light streaks -->
  <g stroke="#3BE8B0" stroke-opacity="0.10" stroke-width="1.5">
    <path d="M-40 320 L300 -20"/>
    <path d="M20 320 L360 -20"/>
    <path d="M1180 320 L1340 140"/>
  </g>

  <!-- monogram -->
  <g transform="translate(86,96)">
    <circle cx="64" cy="64" r="60" fill="#0E1A1C" stroke="#1E3A36" stroke-width="1.5"/>
    <ellipse cx="64" cy="64" rx="58" ry="23" fill="none" stroke="url(#accent)" stroke-opacity="0.45" stroke-width="2.5" transform="rotate(-32 64 64)"/>
    <circle cx="64" cy="64" r="40" fill="none" stroke="url(#accent)" stroke-width="12" stroke-linecap="butt"/>
    <path d="M83 83 L113 113" stroke="url(#ember)" stroke-width="12" stroke-linecap="round"/>
    <circle cx="13" cy="38" r="4" fill="#3BE8B0"/>
    <circle cx="118" cy="82" r="3" fill="#FFB020"/>
  </g>

  <!-- wordmark -->
  <g font-family="'Helvetica Neue',Helvetica,Arial,sans-serif">
    <text x="258" y="142" fill="url(#word)" font-size="50" font-weight="700" letter-spacing="7">QUANTIUM CREW</text>
    <text x="262" y="182" fill="#8FB8AE" font-size="19" font-weight="500" letter-spacing="1.2">Software a la medida desde Panama — web, Apple nativo, dashboards y automatizacion.</text>

    <rect x="262" y="206" width="220" height="2" fill="url(#rule)"/>

    <g font-size="13" font-weight="600" letter-spacing="3.4" fill="#5FD9B6">
      <text x="262" y="246">SOCIEDAD ANONIMA · CIUDAD DE PANAMA</text>
      <text x="262" y="272" fill="#6E8A84" letter-spacing="3.4">REACT · TYPESCRIPT · SWIFT · NODE · PYTHON · DOCKER</text>
    </g>
  </g>

  <!-- orbital motif, right -->
  <g transform="translate(1078,160)" fill="none" stroke-linecap="round">
    <circle r="112" stroke="#1F3B37" stroke-width="1.2"/>
    <circle r="82" stroke="#1F3B37" stroke-width="1.2"/>
    <circle r="52" stroke="#1F3B37" stroke-width="1.2"/>
    <path d="M0 -112 A112 112 0 0 1 97 -56" stroke="url(#accent)" stroke-width="5"/>
    <path d="M0 82 A82 82 0 0 1 -71 41" stroke="url(#accent)" stroke-width="4" stroke-opacity="0.75"/>
    <path d="M52 0 A52 52 0 0 1 26 45" stroke="url(#ember)" stroke-width="4"/>
    <circle cx="0" cy="-112" r="5.5" fill="#3BE8B0" stroke="none"/>
    <circle cx="-71" cy="41" r="4.5" fill="#00C08B" stroke="none"/>
    <circle cx="26" cy="45" r="4" fill="#FFB020" stroke="none"/>
    <circle r="9" fill="#3BE8B0" stroke="none" fill-opacity="0.9"/>
    <circle r="18" stroke="#3BE8B0" stroke-opacity="0.35" stroke-width="1.5"/>
  </g>

  <rect x="0" y="316" width="1280" height="4" fill="url(#rule)"/>
</svg>
